<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring AI 接口测试台 · ChatAnywhere/DeepSeek</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --line:#e3e8f0; --txt:#1f2937; --muted:#6b7280;
    --brand:#4f46e5; --brand-2:#7c3aed; --ok:#16a34a; --danger:#dc2626; --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--txt)}
  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 60px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .logo{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-2));
        display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px}
  h1{font-size:20px;margin:0} .sub{color:var(--muted);font-size:13px;margin-top:3px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px;
        box-shadow:0 1px 3px rgba(16,24,40,.05)}
  .card h2{font-size:14px;margin:0 0 12px;color:var(--muted);font-weight:600;letter-spacing:.3px}
  label{font-size:13px;color:var(--muted);display:block;margin:0 0 6px}
  input[type=text], textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;
        font-family:inherit;outline:none;background:#fbfcfe;transition:border-color .15s}
  input:focus, textarea:focus{border-color:var(--brand)}
  textarea{min-height:84px;resize:vertical}
  .row{display:flex;gap:12px;flex-wrap:wrap}.row>div{flex:1;min-width:200px}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  button{border:0;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;color:#fff;transition:transform .05s,opacity .15s}
  button:active{transform:translateY(1px)} button:disabled{opacity:.5;cursor:not-allowed}
  .btn-sync{background:linear-gradient(135deg,var(--brand),var(--brand-2))}
  .btn-stream{background:#0891b2} .btn-clear{background:#fff;color:var(--danger);border:1px solid #fecaca}
  .output{position:relative}
  .tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;margin-bottom:8px}
  .tag.sync{background:#ede9fe;color:var(--brand)}
  .tag.stream{background:#cffafe;color:#0e7490}
  pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:14px;line-height:1.7;margin:0;min-height:1em}
  #streamBox,#syncBox{border:1px solid var(--line);border-radius:8px;padding:14px;background:#fbfcfe;max-height:340px;overflow:auto}
  #streamBox:empty::before,#syncBox:empty::before{content:"（暂无内容，输入消息后点击按钮）";color:var(--muted);font-size:13px}
  .cursor{display:inline-block;width:8px;height:16px;background:var(--brand);vertical-align:-2px;animation:blink .8s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .status{font-size:13px;color:var(--muted);margin-top:10px;min-height:18px}
  .status.err{color:var(--danger)} .status.ok{color:var(--ok)}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid #c7d2fe;border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .model{font-size:12px;color:var(--muted);margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">AI</div>
    <div><h1>Spring AI 接口测试台</h1>
      <div class="sub">对接 ChatAnywhere（OpenAI 兼容）· 演示 同步 / 流式 / 对话记忆</div></div>
  </header>

  <div class="card">
    <h2>会话</h2>
    <label for="convId">会话 ID（conversationId，同一 ID 下多轮对话会记住上文）</label>
    <input id="convId" type="text" value="user-001">
  </div>

  <div class="card">
    <h2>消息</h2>
    <label for="msg">输入内容</label>
    <textarea id="msg" placeholder="你好，介绍一下自己"></textarea>
    <div class="btns">
      <button class="btn-sync"  id="btnSync">同步回复</button>
      <button class="btn-stream" id="btnStream" style="display:flex;align-items:center;gap:6px">▶ 流式回复（打字机）</button>
      <button class="btn-clear" id="btnClear">清空该会话记忆</button>
    </div>
    <div class="status" id="status">就绪。填入消息后点击按钮测试。</div>
  </div>

  <div class="card output">
    <h2>输出</h2>
    <div style="margin-bottom:14px">
      <span class="tag stream">流式</span>
      <pre id="streamBox"></pre>
    </div>
    <div>
      <span class="tag sync">同步</span>
      <pre id="syncBox"></pre>
    </div>
    <div class="model">接口：<code>/chat/sync</code> · <code>/chat/stream</code>(SSE) · <code>DELETE /chat/memory/{id}</code></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const enc = encodeURIComponent;

function setStatus(msg, type){ const s = $('status'); s.className = 'status' + (type?' '+type:''); s.innerHTML = msg; }

/* ---------- 同步回复 ---------- */
async function doSync(){
  const msg = $('msg').value.trim(), cid = $('convId').value.trim();
  if(!msg) return setStatus('请先输入消息','err');
  clearBox('syncBox');
  setStatus('<span class="spinner"></span>同步请求中…');
  const btn=$('btnSync'); btn.disabled=true;
  try{
    const r = await fetch(`/chat/sync?message=${enc(msg)}&conversationId=${enc(cid)}`);
    const text = await r.text();
    if(!r.ok){ $('syncBox').textContent = text; return setStatus(`同步失败 HTTP ${r.status}`,'err'); }
    $('syncBox').textContent = text;
    setStatus(`同步完成 (HTTP ${r.status})`,'ok');
  }catch(e){ setStatus('请求异常：'+e.message,'err'); }
  finally{ btn.disabled=false; }
}

/* ---------- 流式回复（SSE 增量） ---------- */
async function doStream(){
  const msg = $('msg').value.trim(), cid = $('convId').value.trim();
  if(!msg) return setStatus('请先输入消息','err');
  const box = $('streamBox'); clearBox(null, true);
  setStatus('<span class="spinner"></span>流式连接中…');
  const btn=$('btnStream'); btn.disabled=true;
  try{
    // 流式请求完成后返回 HTTP 状态（放在最后一行的管道变量）
    const r = await fetch(`/chat/stream?message=${enc(msg)}&conversationId=${enc(cid)}`);
    if(!r.ok || !r.body){
      const t = await r.text(); box.textContent = t;
      return setStatus(`流式失败 HTTP ${r.status}`,'err');
    }
    setStatus(`流式已连接，正在接收… (HTTP ${r.status})`);
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    let text = '';
    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      // 按 SSE event 分隔符解析
      let idx;
      while((idx = buf.indexOf('\n\n')) !== -1){
        const event = buf.slice(0, idx); buf = buf.slice(idx+2);
        for(const line of event.split('\n')){
          if(!line.startsWith('data:')) continue;
          const d = line.slice(5).trim();
          if(d === '[DONE]' || d === '') continue;
          text += d; box.textContent = text;
          box.scrollTop = box.scrollHeight;
        }
      }
    }
    setStatus('流式完成','ok');
  }catch(e){ setStatus('流式异常：'+e.message,'err'); }
  finally{ btn.disabled=false; }
}

/* ---------- 清空记忆 ---------- */
async function doClear(){
  const cid = $('convId').value.trim();
  if(!cid) return setStatus('请先填写会话 ID','err');
  const btn=$('btnClear'); btn.disabled=true;
  try{
    const r = await fetch(`/chat/memory/${enc(cid)}`, {method:'DELETE'});
    if(r.ok) setStatus(`已清空会话「${cid}」的记忆 (HTTP ${r.status})`,'ok');
    else setStatus(`清空失败 HTTP ${r.status}`,'err');
  }catch(e){ setStatus('请求异常：'+e.message,'err'); }
  finally{ btn.disabled=false; }
}

function clearBox(id, isStream){
  if(isStream){ $('streamBox').innerHTML=''; }
  else{ $(id).innerHTML=''; }
}

$('btnSync').onclick   = doSync;
$('btnStream').onclick = doStream;
$('btnClear').onclick  = doClear;
$('msg').addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.ctrlKey||e.metaKey)) doSync(); });
</script>
</body>
</html>
